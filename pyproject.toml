[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flashns"
version = "0.1.0"
description = "FP64 Taylor jets and explicit-gradient Navier-Stokes PINN experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "sympy>=1.13,<2", "mpmath>=1.3,<2", "torch>=2.8,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/flashns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
