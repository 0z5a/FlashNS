name: CPU regression and evidence hashes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evidence-hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify manuscript evidence index
        run: python scripts/verify_evidence_index.py

  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=2,<3" "scipy>=1.14,<2" "sympy>=1.13,<2" "mpmath>=1.3,<2" "pytest>=8,<10"
      - name: Package CPU tests
        run: PYTHONPATH=src python -m pytest -q
      - name: C36 CPU regression (49 tests)
        working-directory: research/c36-potential-proof
        run: >
          PYTHONPATH=src python -m unittest -v
          test_c36_unpack test_c36_packed
          box376.test_coordinate_oracle box376.test_potential_geometry
          box376.test_potential_ad_objective box376.test_potential_audit
          box376.test_fold_zero_gate box376.test_schedule_family
          box376.test_decide_c36_v4 box376.test_decide_c36_v5 box376.test_decide_c36_v6
          box376.test_decide_c36_v7 box376.test_ssbroyden
